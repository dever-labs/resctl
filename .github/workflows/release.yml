name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Embed version resources
        run: goversioninfo -64 -o resource.syso

      - name: Build
        env:
          REF_NAME: ${{ github.ref_name }}
        run: go build -ldflags="-s -w -X main.version=$env:REF_NAME" -o resctl.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resctl-windows
          path: resctl.exe

  build-linux:
    name: Build (Linux ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            output: resctl
            artifact: resctl-linux
          - arch: arm64
            output: resctl-linux-arm64
            artifact: resctl-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          REF_NAME: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
          OUTPUT: ${{ matrix.output }}
        run: GOOS=linux go build -ldflags="-s -w -X main.version=$REF_NAME" -o "$OUTPUT" .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}

  build-macos:
    name: Build (macOS ${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact: resctl-macos-amd64
          - arch: arm64
            artifact: resctl-macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          REF_NAME: ${{ github.ref_name }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w -X main.version=$REF_NAME" -o "${{ matrix.artifact }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  combine-macos:
    name: Combine macOS universal binary
    runs-on: macos-latest
    needs: build-macos
    steps:
      - name: Download amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-macos-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-macos-arm64

      - name: Create universal binary
        run: |
          chmod +x resctl-macos-amd64 resctl-macos-arm64
          lipo -create -output resctl-macos resctl-macos-amd64 resctl-macos-arm64
          lipo -info resctl-macos

      - name: Upload universal artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resctl-macos
          path: resctl-macos

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, combine-macos]
    permissions:
      contents: write
    steps:
      - name: Download Windows binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-windows

      - name: Download Linux binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-linux

      - name: Download Linux arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-linux-arm64

      - name: Download macOS universal binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: resctl-macos

      - name: Generate checksums
        run: sha256sum resctl.exe resctl resctl-linux-arm64 resctl-macos > checksums.txt

      - name: Create or update release and attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$REF_NAME" > /dev/null 2>&1; then
            gh release upload "$REF_NAME" resctl.exe resctl resctl-linux-arm64 resctl-macos checksums.txt --clobber
          else
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --generate-notes \
              resctl.exe resctl resctl-linux-arm64 resctl-macos checksums.txt
          fi
          gh release edit "$REF_NAME" --draft=false
