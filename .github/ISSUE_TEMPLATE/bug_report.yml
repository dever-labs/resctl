name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Most issues in resctl are platform- or display-server-specific, so please fill in as much of the environment info as you can.

  - type: input
    id: version
    attributes:
      label: resctl version
      description: Output of `resctl version` / `resctl --version`
      placeholder: "v0.5.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: dropdown
    id: display-server
    attributes:
      label: Display server (Linux only)
      description: Leave blank on Windows/macOS.
      options:
        - N/A (Windows/macOS)
        - X11
        - Wayland (please name the compositor below)

  - type: input
    id: compositor
    attributes:
      label: Compositor / desktop environment (if Wayland or relevant)
      placeholder: "Sway, Hyprland, GNOME, KDE Plasma, ..."

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the exact command you ran and its full output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Output of `resctl list` for the affected display, config/state file contents, etc. — whatever seems relevant.
